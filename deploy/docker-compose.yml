# corp-os 本地基础设施（公司可运行标准 · 第 1 步）
#
# 作用：先把「依赖服务」跑起来，应用代码还没迁库/接向量。
# 包含：
#   - PostgreSQL  → 以后存用户、会话、审批、审计（业务库）
#   - etcd/minio  → Milvus 自己依赖的元数据与对象存储
#   - Milvus      → 以后存文档向量（语义检索）
#   - Redis       → 登录限流 / ERP token / OpenAPI catalog 缓存（多实例共享）
#
# 启动：
#   cd deploy && cp .env.example .env && docker compose up -d
# 停止：
#   docker compose down
# 清数据（危险）：
#   docker compose down -v

name: corp-os-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: corp_os_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-corp_os}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - corp_os_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corpos} -d ${POSTGRES_DB:-corp_os}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - corp_os_net

  redis:
    image: redis:7-alpine
    container_name: corp_os_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - corp_os_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - corp_os_net

  # --- Milvus 依赖：etcd（元数据协调）---
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: corp_os_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - corp_os_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - corp_os_net

  # --- Milvus 依赖：MinIO（向量段文件存储）---
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: corp_os_minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - corp_os_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - corp_os_net

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: corp_os_milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - corp_os_milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - corp_os_net

volumes:
  corp_os_pg_data:
  corp_os_redis_data:
  corp_os_etcd_data:
  corp_os_minio_data:
  corp_os_milvus_data:

networks:
  corp_os_net:
    driver: bridge
