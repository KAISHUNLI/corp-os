# corp-os 一键部署
#
# 包含：
#   - PostgreSQL / Redis / etcd / MinIO / Milvus（依赖）
#   - api（FastAPI）
#   - web（Nginx 静态前端，反代 /api → api）
#
# 仅基础设施（本地开发）：
#   cd deploy && cp .env.example .env && docker compose up -d
# 完整应用（服务器）：
#   cd deploy && cp .env.example .env   # 先改密钥/密码/CORS
#   docker compose --profile app up -d --build
# 停止：
#   docker compose --profile app down
# 清数据（危险）：
#   docker compose --profile app down -v

name: corp-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: corp_os_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-corp_os}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - corp_os_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corpos} -d ${POSTGRES_DB:-corp_os}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - corp_os_net

  redis:
    image: redis:7-alpine
    container_name: corp_os_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - corp_os_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - corp_os_net

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: corp_os_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - corp_os_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - corp_os_net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: corp_os_minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - corp_os_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - corp_os_net

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: corp_os_milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - corp_os_milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks:
      - corp_os_net

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    container_name: corp_os_api
    env_file:
      - .env
    environment:
      CORP_OS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-corpos}:${POSTGRES_PASSWORD:-corpos_dev_password}@postgres:5432/${POSTGRES_DB:-corp_os}
      CORP_OS_REDIS_URL: redis://redis:6379/0
      CORP_OS_MILVUS_URI: http://milvus:19530
      CORP_OS_UPLOAD_DIR: /data/uploads
      HF_HOME: /data/hf-cache
    volumes:
      - corp_os_uploads:/data/uploads
      - corp_os_hf_cache:/data/hf-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - corp_os_net

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    container_name: corp_os_web
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8081}:80"
    networks:
      - corp_os_net

volumes:
  corp_os_pg_data:
  corp_os_redis_data:
  corp_os_etcd_data:
  corp_os_minio_data:
  corp_os_milvus_data:
  corp_os_uploads:
  corp_os_hf_cache:

networks:
  corp_os_net:
    driver: bridge
